# Example nginx site config for VitalMen API (copy to /etc/nginx/sites-available/ on server).
# Must match menbackend .env: UPLOAD_VIDEO_MAX_MB=512

server {
    listen 80;
    server_name api.vitalmen.mn;  # your API domain

    # Default nginx limit is 1m — increase for admin video uploads
    client_max_body_size 512M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large uploads can take time
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_body_timeout 600s;
    }
}
